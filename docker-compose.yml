services:
  mongo:
    image: mongo
    container_name: local-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  nextjs:
    build:
      context: .
      target: dev
    container_name: e-learning-next
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true            # 👈 Enables polling
      - WATCHPACK_POLL_INTERVAL=1000   
    depends_on:
      - mongo

volumes:
  mongo-data:
